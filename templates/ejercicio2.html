<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <main class="tarjeta">
        <h1>Inicio de sesión</h1>
        <form method="POST" action="{{ url_for('ejercicio2') }}">
            <label for="usuario">Ingresa tu nombre</label>
            <input id="usuario" name="usuario" type="text" autocomplete="username" required>

            <label for="contrasena">Ingresa tu contraseña</label>
            <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required>

            <button type="submit">Verificar</button>
        </form>

        {% if mensaje %}
            <p class="mensaje {{ tipo_mensaje }}">{{ mensaje }}</p>
        {% endif %}
        <a class="volver" href="{{ url_for('inicio') }}">Volver al menú</a>
    </main>
</body>
</html>
