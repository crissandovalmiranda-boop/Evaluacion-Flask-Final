<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de compras</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <main class="tarjeta">
        <h1>Cálculo de compras</h1>
        <form method="POST" action="{{ url_for('ejercicio1') }}">
            <label for="nombre">Ingresa tu nombre</label>
            <input id="nombre" name="nombre" type="text" required>

            <label for="edad">Ingresa tu edad</label>
            <input id="edad" name="edad" type="number" min="0" required>

            <label for="cantidad">Ingresa la cantidad de tarros de pintura a comprar</label>
            <input id="cantidad" name="cantidad" type="number" min="1" required>

            <button type="submit">Calcular</button>
        </form>
        <a class="volver" href="{{ url_for('inicio') }}">Volver al menú</a>
    </main>
</body>
</html>
